name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: brew install swiftlint

      - name: Lint Swift sources
        run: Scripts/ci.sh lint

      - name: Run RDPKit tests
        timeout-minutes: 10
        run: Scripts/ci.sh test

      - name: Run example tests
        run: Scripts/ci.sh example-tests

      - name: Build example apps and tools
        run: Scripts/ci.sh example-builds

  apple-platforms:
    name: ${{ matrix.name }} build
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: [iOS, tvOS, Mac Catalyst, visionOS]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build RDPKit
        run: Scripts/ci.sh platform '${{ matrix.name }}'
